[package]
name = "scout-snmp"
version = "0.1.0"
description = "Tolerant SNMP engine for Scout MIB Browser"
edition = "2021"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
snmp2 = { version = "0.5", features = ["v3"] }
tokio = { version = "1", features = ["rt", "time"] }
tracing = "0.1"

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
