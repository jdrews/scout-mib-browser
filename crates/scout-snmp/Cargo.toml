[package]
name = "scout-snmp"
version = "0.1.0"
description = "Tolerant SNMP engine for Scout MIB Browser"
edition = "2021"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
snmp2 = { version = "0.5", features = ["v3", "heap_buffers"] }
tokio = { version = "1", features = ["rt", "time", "net"] }
tracing = "0.1"

[features]
# Test-only mock SNMP agent (`src/mock.rs`). Off by default so the shipping
# binary carries no test agent — no UDP listener, no `.expect()` panic paths
# (launch-beta/09). This crate's integration tests enable it through the
# dev-dependency self-reference below.
mock = []

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# Cargo has no dev-only features: the self-reference turns `mock` on for this
# crate's integration tests without making it a default feature.
scout-snmp = { path = ".", features = ["mock"] }
