[package]
name = "scout-mib-browser"
version = "0.1.0"
description = "An SNMP MIB browser with high tolerance for malformed responses"
edition = "2021"
license = "MIT"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-wdio-webdriver = { version = "1", optional = true }
tauri-plugin-wdio = { version = "1", optional = true }
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
scout-mib = { path = "../crates/scout-mib" }
scout-snmp = { path = "../crates/scout-snmp" }
config = "0.15"
dirs = "6"
toml = "1.1"
tracing = "0.1"
tracing-core = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tokio = { version = "1", features = ["full"] }

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]
devtools = []
wdio = ["dep:tauri-plugin-wdio-webdriver", "dep:tauri-plugin-wdio"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
