name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: read-all

env:
  CARGO_TERM_COLOR: always

jobs:
  verify-rust:
    name: Verify Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libdbus-1-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libsoup-3.0-dev \
            librsvg2-dev \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features

      - name: Run tests
        run: cargo test --workspace --all-features

  verify-web:
    name: Verify Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run check

      - name: Build frontend
        run: npm run build:web

  # E2E suite: drives the real (debug, wdio-feature) Tauri binary headless via
  # the embedded WebDriver server + Xvfb, against a local mock SNMP agent.
  # Runtime is dominated by the Rust build, so it leans hard on caching:
  # sccache + target/ + cargo registry (Swatinem/rust-cache) and the npm cache.
  # Cold first run is slow; warm runs should land well under 15 min.
  e2e:
    name: Build + E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libdbus-1-dev \
            libssl-dev \
            libsoup-3.0-dev \
            librsvg2-dev \
            libgbm1 \
            libasound2-data \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxrandr2 \
            build-essential \
            curl \
            wget \
            file \
            pkg-config \
            python3-pip \
            snmp \
            sccache

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      # sccache: cache per-crate compilations so a changed source only rebuilds
      # what actually changed. RUSTC_WRAPPER is what Swatinem/rust-cache looks
      # for to also cache the sccache dir (alongside target/ and the registry).
      - name: Enable sccache
        run: |
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_IDLE_TIMEOUT=0" >> "$GITHUB_ENV"
          echo "sccache ready: $(sccache --version | head -1)"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      # The harness runs `python3 scripts/snmpsim-test.py`, which imports
      # snmpsim and shells out to the `snmpsim-command-responder` console
      # script. pysmi is a runtime dependency of that responder that is NOT
      # declared in snmpsim's (or pysnmp's) metadata, so `pip install snmpsim`
      # alone leaves it unable to start — install pysmi explicitly. The
      # --break-system-packages fallback covers PEP 668 runners.
      - name: Install snmpsim
        run: |
          python3 -m pip install snmpsim pysmi 2>/dev/null || python3 -m pip install --break-system-packages snmpsim pysmi
          # Verify the responder's full import chain works (this is what failed
          # with the missing pysmi) so any other undeclared dep is caught up
          # front instead of as an agent timeout.
          python3 -c "from snmpsim.commands.responder import main; print('responder import chain OK')"

      - run: npm ci

      # Debug build (fast to compile) with the embedded WebDriver server.
      # The app loads its frontend from the Vite dev server the harness starts,
      # so no production `build:web` is needed here.
      - name: Build app (debug, wdio feature)
        run: cargo build --workspace --features scout-mib-browser/wdio

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: logs/

      # The harness copies the agent/vite logs here when the run fails — this
      # is what tells us why a mock agent "did not come up".
      - name: Upload e2e failure logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-logs
          path: e2e-failure-logs/
          if-no-files-found: ignore
